<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | E-Nose AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="auth-container">
        <div class="glass-panel auth-box">
            <h2 id="auth-title">System Login</h2>
            <div id="login-form">
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <button onclick="handleAuth('login')">Access Core</button>
                <p style="margin-top: 1rem; font-size: 0.9rem; text-align: center;">
                    New operator? <a href="#" onclick="toggleAuth(true)" style="color: var(--accent-blue);">Register here</a>
                </p>
            </div>
            
            <div id="signup-form" style="display: none;">
                <input type="text" id="reg-username" placeholder="New Username">
                <input type="password" id="reg-password" placeholder="New Password">
                <button onclick="handleAuth('signup')">Register Operator</button>
                <p style="margin-top: 1rem; font-size: 0.9rem; text-align: center;">
                    Already registered? <a href="#" onclick="toggleAuth(false)" style="color: var(--accent-blue);">Login here</a>
                </p>
            </div>
            <p id="auth-msg" style="margin-top: 1rem; text-align: center; color: var(--danger);"></p>
        </div>
    </div>

    <script>
        // Simple background animation for login
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 7, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for(let i=0; i<10; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#00f2ff' : '#bd00ff';
                ctx.beginPath();
                ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, 1, 0, Math.PI*2);
                ctx.fill();
            }
            requestAnimationFrame(animate);
        }
        animate();

        function toggleAuth(showSignup) {
            document.getElementById('login-form').style.display = showSignup ? 'none' : 'block';
            document.getElementById('signup-form').style.display = showSignup ? 'block' : 'none';
            document.getElementById('auth-title').innerText = showSignup ? 'Operator Registry' : 'System Login';
        }

        async function handleAuth(mode) {
            const username = mode === 'login' ? document.getElementById('username').value : document.getElementById('reg-username').value;
            const password = mode === 'login' ? document.getElementById('password').value : document.getElementById('reg-password').value;
            const msg = document.getElementById('auth-msg');

            if (!username || !password) {
                msg.innerText = "All fields required";
                return;
            }

            try {
                const response = await fetch(`http://127.0.0.1:5000/${mode}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok) {
                    if (mode === 'login') {
                        localStorage.setItem('user_id', data.user_id);
                        localStorage.setItem('username', username);
                        window.location.href = 'dashboard.html';
                    } else {
                        msg.style.color = 'var(--success)';
                        msg.innerText = "Registry successful! Please login.";
                        toggleAuth(false);
                    }
                } else {
                    msg.innerText = data.message;
                }
            } catch (err) {
                msg.innerText = "Backend connection failed. Using demo access...";
                setTimeout(() => {
                    localStorage.setItem('user_id', 'demo');
                    localStorage.setItem('username', username);
                    window.location.href = 'dashboard.html';
                }, 1500);
            }
        }
    </script>
</body>
</html>
